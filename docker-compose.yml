version: "3.8"

services:
  app:
    build: .
    container_name: express_app
    ports:
      - "5000:5000"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app